name: agentdojo-gepa_prompt_hardening_benign
output_dir: .artifacts/agentdojo/gepa_prompt_hardening_benign
datasets:
  - label: behavior-benign
    dataset_file: datasets/released/benign_save/merged_eval_in_benign_save_70_true_opt.json
    evaluation_mode: benign_save
attacks:
  - label: none
    attack: none
memory_backend: tool
mention_memory_system: true
grader_model: openai-api/vllm/qwen/qwen3.5-9b
scoring:
  during_eval: full
  post_eval_scorers: []
  post_eval_action: overwrite
retry:
  retry_attempts: 2
  retry_immediate: true
  retry_wait: 5
  retry_connections: 1.0
  retry_on_error: 1
eval:
  max_tasks: 2
  max_connections: 16
  fail_on_error: false
  bundle: false
  max_retries: 2
  attempt_timeout: 900
models:
  - label: qwen3.5-9b
    model: openai-api/vllm/qwen/qwen3.5-9b
    provider: generic
    prompt_model: qwen3.5-9b
defenses:
  - label: gepa_prompt_hardening_suffix
    defense: "gepa_prompt_hardening_suffix"
